<!DOCTYPE html>
<html>
<head>
    <title>My First GitHub Website</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sniglet:wght@400;800&family=Ultra&display=swap" rel="stylesheet">

    <!-- CSS -->
    <style>
        body {
            color: white;
            font-family: 'Sniglet', system-ui, sans-serif;
            background: linear-gradient(
                90deg,
                rgba(2, 0, 36, 1) 0%,
                rgba(9, 9, 121, 1) 35%,

        h1 {
            font-family: 'Ultra', serif;

        .imageflex {

            margin-top: 0;

    <div class="imageflex">

</html>

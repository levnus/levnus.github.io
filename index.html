<!DOCTYPE html>
<html>
<head>
    <title>My First GitHub Website</title>
    
    <style>
        /* Raw Google Font Data Embedded Directly */
        @font-face {
          font-family: 'Sniglet';
          font-style: normal;
          font-weight: 400;
          font-display: swap;
          src: url(https://gstatic.com) format('truetype');
        }
        @font-face {
          font-family: 'Sniglet';
          font-style: normal;
          font-weight: 800;
          font-display: swap;
          src: url(https://gstatic.com) format('truetype');
        }
        @font-face {
          font-family: 'Ultra';
          font-style: normal;
          font-weight: 400;
          font-display: swap;
          src: url(https://gstatic.com) format('truetype');
        }

        /* Apply Sniglet font to the whole website */
        body {
            font-family: 'Sniglet', system-ui, sans-serif;
        }

        /* Apply Ultra font specifically to the main heading */
        h1 {
            font-family: 'Ultra', serif;
            font-weight: 400;
        }

        /* for may text */
        .imageflex { 
            display: flex; 
            align-items: center; 
            gap: 10px;           
        }
        .imageflexcontent { 
            margin-left: 0px; 
            margin-top: 0; 
        }
        body{
            background: #020024;
            background: linear-gradient(90deg, rgba(2, 0, 36, 1) 0%, rgba(9, 9, 121, 1) 35%, rgba(0, 212, 255, 1) 100%);
        }
 
    </style>
</head>
<body>
    <h1>Website for monkeys</h1>
    <p>... and smonkeys</p>

    <!-- may text -->
    <div class="imageflex">
        <img src="https://i.postimg.cc/GptK6Xtz/unnamed.jpg" border="0" alt="may">
        <p class="imageflexcontent">May</p>
    </div>
    <!-- may text -->

</body>
</html>

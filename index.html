<!DOCTYPE html>
<html>
<head>
    <title>My First GitHub Website</title>
    
    <!-- Correctly link Google Fonts from their CDN -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Sniglet:wght@400;800&family=Ultra&display=swap" rel="stylesheet">

    <style>
        /* Apply Sniglet font to the whole website */
        body {
            font-family: 'Sniglet', system-ui, sans-serif;
            background: #020024;
            background: linear-gradient(90deg, rgba(2, 0, 36, 1) 0%, rgba(9, 9, 121, 1) 35%, rgba(0, 212, 255, 1) 100%);
            color: white; /* Optional: Makes text readable against the dark background */
        }

        /* Apply Ultra font specifically to the main heading */
        h1 {
            font-family: 'Ultra', serif;
            font-weight: 400;
        }

        /* Layout styles for the image and text alignment */
        .imageflex {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .imageflexcontent {
            margin-left: 0px;
            margin-top: 0;
        }
    </style>
</head>
<body>

    <h1>Website for monkeys</h1>
    <p>... and smonkeys</p>

    <!-- Character showcase section -->
    <div class="imageflex">
        <img src="https://i.postimg.cc/GptK6Xtz/unnamed.jpg" border="0" alt="may">
        <p class="imageflexcontent">May</p>
    </div>

</body>
</html>
